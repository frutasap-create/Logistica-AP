<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logística - AP Frutas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#152820; --primary:#1E6F5C; --primary-dark:#14503F;
    --surface:#ffffff; --bg:#EEF2F0; --line:#D6DEDA; --muted:#5F726B;
    --coleta-bg:#EDF3E2; --coleta-line:#C9D9AD; --coleta-ink:#3B5320;
  }
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);margin:0 auto;padding:16px;color:var(--ink);max-width:900px}
  h1{font-size:21px;margin:12px 0 16px;font-weight:700;letter-spacing:-.3px}
  h3{color:var(--primary-dark);font-size:16px;margin:0 0 12px}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tabs button{padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
  .tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,40,30,.04)}
  label{font-size:12px;font-weight:600;display:block;margin-bottom:5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;width:100%;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,111,92,.12)}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}
  .row > div{flex:1;min-width:160px}
  button.action{background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
  button.action:hover{background:var(--primary-dark)}
  button.action.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  button.action.secondary:hover{background:#F0F7F4}
  button.action.danger{background:#D64550}
  button.action.small{padding:6px 12px;font-size:12px}
  table.list{width:100%;border-collapse:collapse}
  table.list th{padding:9px 10px;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--line)}
  table.list td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
  .toggle{cursor:pointer}

  #chipsClientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px;margin-bottom:4px}
  #chipsClientes label{display:flex;align-items:center;gap:7px;font-weight:500;font-size:14px;margin:0;text-transform:none;letter-spacing:0;color:var(--ink);padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
  #chipsClientes input{width:auto;flex:0 0 auto}

  .coleta-linha{display:flex;gap:8px;margin-bottom:8px}
  .coleta-linha input{flex:1}

  /* área exportável — formato celular */
  #exportArea{width:380px;background:#fff;font-family:'Segoe UI',Arial,sans-serif;border:1px solid var(--line)}
  .exp-logo{text-align:center;padding:12px;font-weight:700;color:var(--primary-dark);letter-spacing:.5px}
  .exp-head{background:var(--primary-dark);color:#fff;text-align:center;font-weight:700;padding:10px;font-size:14px}
  .exp-row{display:flex;border-bottom:1px solid var(--line)}
  .exp-row .lbl{background:#fff;font-weight:700;padding:9px;width:38%;border-right:1px solid var(--line);color:var(--muted)}
  .exp-row .val{background:#EAF1EE;font-weight:700;padding:9px;width:62%}
  .exp-section-title{background:var(--primary);color:#fff;font-weight:700;padding:9px;font-size:13px;letter-spacing:.3px}
  .exp-item{background:#EAF1EE;padding:9px;border-bottom:1px solid #fff;font-weight:600;text-align:center}
  .exp-coleta-title{background:var(--coleta-line);color:var(--coleta-ink);font-weight:700;padding:9px;font-size:13px;letter-spacing:.3px}
  .exp-coleta{background:var(--coleta-bg);padding:9px;border-bottom:1px solid #fff;font-weight:600;text-align:center;min-height:16px}
</style>
</head>
<body>

<h1>Logística — AP Frutas</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="rota">Rota do dia</button>
  <button class="tab-btn" data-tab="motoristas">Motoristas</button>
  <button class="tab-btn" data-tab="placas">Placas</button>
</div>

<!-- ===================== ROTA ===================== -->
<div id="tab-rota" class="tab-content">
  <div class="card">
    <div class="row">
      <div><label>Data</label><input type="date" id="rData"></div>
      <div><label>Motorista</label><select id="rMotoristaSelect"></select></div>
      <div><label>Placa</label><select id="rPlacaSelect"></select></div>
      <div><label>Destino</label><input id="rDestino" placeholder="Ex: São Paulo"></div>
    </div>

    <label>Entregas (Clientes)</label>
    <div class="chips" id="chipsClientes"></div>

    <label style="margin-top:14px">Coletas (Fornecedores) — campo editável</label>
    <div id="coletasWrap"></div>
    <button class="action secondary small" onclick="addLinhaColeta()">+ adicionar linha</button>

    <div style="margin-top:16px">
      <button class="action" onclick="salvarRota()">Salvar rota</button>
      <button class="action secondary" onclick="gerarImagem()">📷 Gerar imagem</button>
    </div>
  </div>

  <div id="rotasSalvas" class="card"></div>
</div>

<!-- ===================== MOTORISTAS ===================== -->
<div id="tab-motoristas" class="tab-content" style="display:none">
  <div class="card">
    <h3>Novo motorista</h3>
    <div class="row">
      <div><label>Nome</label><input id="novoMotoristaNome" placeholder="Ex: Julio Henrique"></div>
      <div style="flex:0 0 auto"><button class="action" onclick="criarMotorista()">Adicionar</button></div>
    </div>
  </div>
  <div class="card">
    <table class="list" id="tabelaMotoristas"><thead><tr><th>Nome</th><th>Ativo</th><th></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<!-- ===================== PLACAS ===================== -->
<div id="tab-placas" class="tab-content" style="display:none">
  <div class="card">
    <h3>Nova placa</h3>
    <div class="row">
      <div><label>Placa</label><input id="novaPlaca" placeholder="Ex: RFP-4D27"></div>
      <div style="flex:0 0 auto"><button class="action" onclick="criarPlaca()">Adicionar</button></div>
    </div>
  </div>
  <div class="card">
    <table class="list" id="tabelaPlacas"><thead><tr><th>Placa</th><th>Ativo</th><th></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<div style="position:fixed;top:-10000px;left:-10000px">
  <div id="exportArea"></div>
</div>

<script>
const SUPABASE_URL = "https://cagorqpetzsgmttkvlcm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhZ29ycXBldHpzZ210dGt2bGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNzI3NDAsImV4cCI6MjA5OTg0ODc0MH0.2BIcQLPHxEVsGJK1tMoOGhFDu6Viu8X_HGNICl46cso";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let clientes = [], motoristas = [], placas = [];

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).style.display='block';
  });
});

async function carregarBase(){
  const {data:c} = await sb.from('clientes').select('*').eq('ativo', true).order('nome');
  clientes = c || [];
  document.getElementById('chipsClientes').innerHTML = clientes.map(c=>`
    <label><input type="checkbox" value="${c.id}" data-nome="${c.nome}"> ${c.nome}</label>
  `).join('');

  const {data:m} = await sb.from('motoristas').select('*').order('nome');
  motoristas = m || [];
  renderMotoristas();
  document.getElementById('rMotoristaSelect').innerHTML =
    '<option value="">Selecione...</option>' +
    motoristas.filter(x=>x.ativo).map(x=>`<option value="${x.nome}">${x.nome}</option>`).join('');

  const {data:p} = await sb.from('placas').select('*').order('placa');
  placas = p || [];
  renderPlacas();
  document.getElementById('rPlacaSelect').innerHTML =
    '<option value="">Selecione...</option>' +
    placas.filter(x=>x.ativo).map(x=>`<option value="${x.placa}">${x.placa}</option>`).join('');

  document.getElementById('coletasWrap').innerHTML='';
  addLinhaColeta();
  carregarRotasSalvas();
}

// ---------- Motoristas ----------
function renderMotoristas(){
  const tb = document.querySelector('#tabelaMotoristas tbody');
  tb.innerHTML = motoristas.map(m=>`
    <tr>
      <td>${m.nome}</td>
      <td class="toggle" onclick="toggleMotoristaAtivo('${m.id}', ${m.ativo})">${m.ativo? '✅':'⛔'}</td>
      <td><button class="action secondary small" onclick="editarMotorista('${m.id}','${(m.nome||'').replace(/'/g,"\\'")}')">Editar</button></td>
    </tr>`).join('');
}
async function criarMotorista(){
  const nome = document.getElementById('novoMotoristaNome').value.trim();
  if(!nome) return;
  await sb.from('motoristas').insert({nome, ativo:true});
  document.getElementById('novoMotoristaNome').value='';
  carregarBase();
}
async function toggleMotoristaAtivo(id, ativo){
  await sb.from('motoristas').update({ativo: !ativo}).eq('id', id);
  carregarBase();
}
async function editarMotorista(id, nomeAtual){
  const novo = prompt('Nome do motorista:', nomeAtual);
  if(novo && novo.trim()){
    await sb.from('motoristas').update({nome:novo.trim()}).eq('id', id);
    carregarBase();
  }
}

// ---------- Placas ----------
function renderPlacas(){
  const tb = document.querySelector('#tabelaPlacas tbody');
  tb.innerHTML = placas.map(p=>`
    <tr>
      <td>${p.placa}</td>
      <td class="toggle" onclick="togglePlacaAtiva('${p.id}', ${p.ativo})">${p.ativo? '✅':'⛔'}</td>
      <td><button class="action secondary small" onclick="editarPlaca('${p.id}','${(p.placa||'').replace(/'/g,"\\'")}')">Editar</button></td>
    </tr>`).join('');
}
async function criarPlaca(){
  const placa = document.getElementById('novaPlaca').value.trim();
  if(!placa) return;
  await sb.from('placas').insert({placa, ativo:true});
  document.getElementById('novaPlaca').value='';
  carregarBase();
}
async function togglePlacaAtiva(id, ativo){
  await sb.from('placas').update({ativo: !ativo}).eq('id', id);
  carregarBase();
}
async function editarPlaca(id, placaAtual){
  const novo = prompt('Placa:', placaAtual);
  if(novo && novo.trim()){
    await sb.from('placas').update({placa:novo.trim()}).eq('id', id);
    carregarBase();
  }
}

// ---------- Rota ----------
function addLinhaColeta(valor=''){
  const wrap = document.getElementById('coletasWrap');
  const div = document.createElement('div');
  div.className = 'coleta-linha';
  div.innerHTML = `<input type="text" placeholder="Ex: Coleta Ceasa Palato" value="${valor}">
    <button class="action danger small" onclick="this.parentElement.remove()">x</button>`;
  wrap.appendChild(div);
}
function clientesSelecionados(){
  return [...document.querySelectorAll('#chipsClientes input:checked')].map(i=>({id:i.value, nome:i.dataset.nome}));
}
function coletasPreenchidas(){
  return [...document.querySelectorAll('#coletasWrap input')].map(i=>i.value.trim()).filter(Boolean);
}

async function salvarRota(){
  const data = document.getElementById('rData').value;
  const motorista = document.getElementById('rMotoristaSelect').value;
  const placa = document.getElementById('rPlacaSelect').value;
  const destino = document.getElementById('rDestino').value.trim();
  if(!data || !motorista || !placa || !destino){ alert('Preencha data, motorista, placa e destino.'); return; }

  const {data:rota} = await sb.from('rotas').insert({data, motorista, placa, destino}).select().single();
  const entregas = clientesSelecionados();
  if(entregas.length){
    await sb.from('rota_entregas').insert(entregas.map((c,i)=>({rota_id:rota.id, cliente_id:c.id, ordem:i})));
  }
  const coletas = coletasPreenchidas();
  if(coletas.length){
    await sb.from('rota_coletas').insert(coletas.map((texto,i)=>({rota_id:rota.id, texto, ordem:i})));
  }
  alert('Rota salva!');
  carregarRotasSalvas();
}

async function carregarRotasSalvas(){
  const {data} = await sb.from('rotas').select('*').order('data', {ascending:false}).limit(10);
  const wrap = document.getElementById('rotasSalvas');
  if(!data || !data.length){ wrap.innerHTML=''; return; }
  wrap.innerHTML = '<h3>Últimas rotas</h3><table class="list">' +
    data.map(r=>`<tr>
      <td>${new Date(r.data+'T00:00:00').toLocaleDateString('pt-BR')}</td>
      <td>${r.motorista}</td>
      <td>${r.placa}</td>
      <td>${r.destino}</td>
      <td><button class="action secondary small" onclick="gerarImagemDeRota('${r.id}')">📷 imagem</button></td>
    </tr>`).join('') + '</table>';
}

async function montarHtmlRota(rota){
  const {data:entregas} = await sb.from('rota_entregas').select('*, clientes(nome)').eq('rota_id', rota.id).order('ordem');
  const {data:coletas} = await sb.from('rota_coletas').select('*').eq('rota_id', rota.id).order('ordem');
  const dataFmt = new Date(rota.data+'T00:00:00').toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  let html = `
    <div class="exp-logo">AP · FRUTAS•VERDURAS</div>
    <div class="exp-head">${dataFmt}</div>
    <div class="exp-row"><div class="lbl">Motorista</div><div class="val">${rota.motorista}</div></div>
    <div class="exp-row"><div class="lbl">Placa</div><div class="val">${rota.placa}</div></div>
    <div class="exp-row"><div class="lbl">Destino</div><div class="val">${rota.destino}</div></div>
    <div class="exp-section-title">Entregas (Clientes)</div>`;
  (entregas||[]).forEach(e=> html += `<div class="exp-item">${e.clientes?.nome||''}</div>`);
  if(!entregas || !entregas.length) html += `<div class="exp-item">&nbsp;</div>`;
  html += `<div class="exp-coleta-title">Coletas (Fornecedores)</div>`;
  (coletas||[]).forEach(c=> html += `<div class="exp-coleta">${c.texto}</div>`);
  for(let i=(coletas?coletas.length:0); i<3; i++) html += `<div class="exp-coleta">&nbsp;</div>`;
  html += `<div class="exp-logo">AP · FRUTAS•VERDURAS</div>`;
  return html;
}

async function baixarImagem(rota){
  const area = document.getElementById('exportArea');
  area.innerHTML = await montarHtmlRota(rota);
  await new Promise(r=>setTimeout(r,50));
  const canvas = await html2canvas(area, {backgroundColor:'#fff', scale:2});
  const link = document.createElement('a');
  link.download = `rota-${rota.destino}-${rota.data}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function gerarImagem(){
  const rota = {
    data: document.getElementById('rData').value,
    motorista: document.getElementById('rMotoristaSelect').value,
    placa: document.getElementById('rPlacaSelect').value,
    destino: document.getElementById('rDestino').value.trim(),
  };
  if(!rota.data || !rota.motorista || !rota.placa || !rota.destino){ alert('Preencha data, motorista, placa e destino.'); return; }
  const dataFmt = new Date(rota.data+'T00:00:00').toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const entregas = clientesSelecionados();
  const coletas = coletasPreenchidas();
  let html = `
    <div class="exp-logo">AP · FRUTAS•VERDURAS</div>
    <div class="exp-head">${dataFmt}</div>
    <div class="exp-row"><div class="lbl">Motorista</div><div class="val">${rota.motorista}</div></div>
    <div class="exp-row"><div class="lbl">Placa</div><div class="val">${rota.placa}</div></div>
    <div class="exp-row"><div class="lbl">Destino</div><div class="val">${rota.destino}</div></div>
    <div class="exp-section-title">Entregas (Clientes)</div>`;
  entregas.forEach(e=> html += `<div class="exp-item">${e.nome}</div>`);
  if(!entregas.length) html += `<div class="exp-item">&nbsp;</div>`;
  html += `<div class="exp-coleta-title">Coletas (Fornecedores)</div>`;
  coletas.forEach(c=> html += `<div class="exp-coleta">${c}</div>`);
  for(let i=coletas.length; i<3; i++) html += `<div class="exp-coleta">&nbsp;</div>`;
  html += `<div class="exp-logo">AP · FRUTAS•VERDURAS</div>`;
  const area = document.getElementById('exportArea');
  area.innerHTML = html;
  await new Promise(r=>setTimeout(r,50));
  const canvas = await html2canvas(area, {backgroundColor:'#fff', scale:2});
  const link = document.createElement('a');
  link.download = `rota-${rota.destino}-${rota.data}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function gerarImagemDeRota(id){
  const {data:rota} = await sb.from('rotas').select('*').eq('id', id).single();
  await baixarImagem(rota);
}

carregarBase();
</script>
</body>
</html>
